<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administration — L'Esprit Illuminé</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#322449,#100f20 70%);color:#f7eff9;font:16px/1.5 system-ui}
main{max-width:680px;margin:0 auto;padding:35px 18px}h1,h2{font-family:Georgia,serif;color:#efd19a}h1{font-size:36px}
.panel{background:#211a34;border:1px solid #675179;border-radius:18px;padding:22px;margin:20px 0}
label{display:block;margin:12px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #806b94;border-radius:10px;background:#130f20;color:white;font:inherit}
textarea{min-height:95px}button{border:0;border-radius:10px;background:#e8c88d;color:#25182c;padding:12px 18px;font-weight:bold;cursor:pointer;margin-top:12px}
button.secondary{background:#5c4b70;color:white}button:disabled{opacity:.5}.muted{color:#c8bbd2}.hide{display:none}
#preview{width:100%;max-height:260px;object-fit:contain;margin-top:12px;border-radius:10px}
#message{padding:12px;white-space:pre-wrap}a{color:#efd19a}
</style></head><body><main><h1>✦ L'Esprit Illuminé</h1><p class="muted">Administration — ajoute une image et elle apparaît sur ton site après publication.</p>
<section class="panel" id="login"><h2>Connexion</h2><label>E-mail</label><input id="email" type="email" autocomplete="username"><label>Mot de passe</label><input id="password" type="password" autocomplete="current-password"><button id="signin">Se connecter</button></section>
<section class="panel hide" id="editor"><h2>Ajouter une image</h2><p class="muted">Une image à la fois. Pour créer une collection, écris son nom dans le champ ci-dessous.</p>
<label>Collection</label><input id="collection" list="collections" placeholder="Ex. Éveil de la conscience"><datalist id="collections"></datalist>
<label>Titre de l'image</label><input id="titre" placeholder="Ex. La lumière intérieure">
<label>Description</label><textarea id="description" placeholder="Décris cette étape..."></textarea>
<label>Image (JPG, PNG ou WebP, maximum 5 Mo)</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="hide" alt="Aperçu">
<button id="publish">Publier sur mon site</button> <button class="secondary" id="logout">Déconnexion</button>
<p class="muted">Site public : <a href="./" target="_blank" rel="noopener">L'Esprit Illuminé ↗</a></p></section>
<div id="message" role="status" aria-live="polite"></div></main>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://bzsxgpcwxpixirciythv.supabase.co','sb_publishable_KA_mPT660A1EMxEyIRa1Hw_SS8mUm-v');
const $=id=>document.getElementById(id);
const message=t=>$('message').textContent=t;
async function refresh(){
 const {data:{session}}=await db.auth.getSession();
 $('login').classList.toggle('hide',!!session);$('editor').classList.toggle('hide',!session);
 if(session){const {data,error}=await db.from('collections_images').select('collection');if(!error){const names=[...new Set(data.map(x=>x.collection))];$('collections').replaceChildren(...names.map(n=>{const o=document.createElement('option');o.value=n;return o}))}}
}
$('signin').onclick=async()=>{message('Connexion...');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message('Connexion refusée : '+error.message);else{message('Connectée !');$('password').value='';await refresh()}};
$('logout').onclick=async()=>{await db.auth.signOut();await refresh();message('Déconnectée.')};
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hide')};
$('publish').onclick=async()=>{
 const file=$('file').files[0],collection=$('collection').value.trim(),titre=$('titre').value.trim(),description=$('description').value.trim();
 if(!file||!collection||!titre){message('Choisis une image, une collection et un titre.');return}
 if(!['image/webp','image/jpeg','image/png'].includes(file.type)||file.size>5*1024*1024){message('Image non acceptée : utilise JPG, PNG ou WebP de moins de 5 Mo.');return}
 $('publish').disabled=true;message('Envoi de l’image...');
 const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
 const path=crypto.randomUUID()+'.'+ext;
 try{
  const {error:upErr}=await db.storage.from('images').upload(path,file,{contentType:file.type,upsert:false});
  if(upErr)throw new Error('Stockage : '+upErr.message);
  const {data:{publicUrl}}=db.storage.from('images').getPublicUrl(path);
  const {error:rowErr}=await db.from('collections_images').insert({collection,titre,description,image_url:publicUrl});
  if(rowErr)throw new Error('Base de données : '+rowErr.message);
  message('Image publiée ! Elle apparaîtra sur le site à la prochaine actualisation.');
  $('titre').value='';$('description').value='';$('file').value='';$('preview').classList.add('hide');await refresh();
 }catch(e){message('Échec : '+e.message+'\nVérifie les permissions Supabase.')}finally{$('publish').disabled=false}
};
await refresh();
</script></body></html>
